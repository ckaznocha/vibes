packages:
  - "apps/*"
  - "libs/*"
minimumReleaseAge: 1440
# `install`, not `error`: a fresh git worktree has no node_modules, and `error`
# makes every pnpm command in it fail with "Run pnpm install" until you do it by
# hand. `install` just performs the install, so a new worktree is usable
# immediately. It is still a hard sync check — it never silently runs against
# out-of-date node_modules.
verifyDepsBeforeRun: install
strictDepBuilds: true
allowBuilds:
  "@swc/core": true
  esbuild: true
  nx: true
  unrs-resolver: true
overrides:
  axios: "^1.18.1"
  "brace-expansion@5": "^5.0.8"
  "@hono/node-server": "^2.0.12"
