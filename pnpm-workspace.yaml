packages:
  - "apps/*"
  - "libs/*"
minimumReleaseAge: 1440
# `install`, not `error`: a fresh git worktree has no node_modules, and `error`
# makes every pnpm command in it fail with "Run pnpm install" until you do it by
# hand. `install` just performs the install, so a new worktree is usable
# immediately. It is still a hard sync check — it never silently runs against
# out-of-date node_modules.
verifyDepsBeforeRun: install
strictDepBuilds: true
allowBuilds:
  "@swc/core": true
  esbuild: true
  nx: true
  unrs-resolver: true
overrides:
  axios: "^1.18.1"
  "brace-expansion@5": "^5.0.8"
  "@hono/node-server": "^2.0.12"
  # Transitive-only advisories — see .github/workflows/security-auto-remediate.yml.
  # `pnpm audit --fix override` emits one selector per advisory, which produces
  # overlapping ranges (four for hono alone). Collapsed to the broadest selector
  # per major line: each of these subsumes the narrower ones it replaced.
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "fast-uri@>=3.0.0 <3.1.5": "^3.1.5"
  "hono@<4.12.34": "^4.12.34"
  "js-yaml@>=3.0.0 <3.15.1": "^3.15.1"
  axios@>=1.0.0 <1.20.0: ^1.20.0
  axios@>=1.12.0 <1.20.0: ^1.20.0
  axios@>=1.13.0 <1.20.0: ^1.20.0
  axios@>=1.15.0 <1.20.0: ^1.20.0
  axios@>=1.15.1 <1.20.0: ^1.20.0
  axios@>=1.15.2 <1.20.0: ^1.20.0
  axios@>=1.16.1 <1.20.0: ^1.20.0
  axios@>=1.17.0 <1.20.0: ^1.20.0
  axios@>=1.7.0 <1.20.0: ^1.20.0
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  brace-expansion@<1.1.19: ^1.1.19
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  follow-redirects@>=1.16.0 <1.16.1: ^1.16.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  nx@>=23.0.0 <23.1.2: ^23.1.2
  nx@>=23.0.0 <23.2.1: ^23.2.1
  smol-toml@<=1.7.0: ^1.7.1
  smol-toml@<=1.8.0: ^1.8.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=7.1.0 <7.29.1: ^7.29.1
  undici@>=7.11.0 <7.29.1: ^7.29.1
  undici@>=7.15.0 <7.29.1: ^7.29.1
  undici@>=7.15.0 <7.30.1: ^7.30.1
  undici@>=7.18.0 <7.30.1: ^7.30.1
  undici@>=7.24.1 <7.29.1: ^7.29.1
  undici@>=7.28.0 <7.29.1: ^7.29.1
  zod@<4.6.6: ^4.6.6
minimumReleaseAgeExclude:
  - js-yaml@3.15.2
  - smol-toml@1.7.1 || 1.8.1
