packages:
  - "apps/*"
  - "libs/*"
minimumReleaseAge: 1440
# `install`, not `error`: a fresh git worktree has no node_modules, and `error`
# makes every pnpm command in it fail with "Run pnpm install" until you do it by
# hand. `install` just performs the install, so a new worktree is usable
# immediately. It is still a hard sync check — it never silently runs against
# out-of-date node_modules.
verifyDepsBeforeRun: install
strictDepBuilds: true
allowBuilds:
  "@swc/core": true
  esbuild: true
  nx: true
  unrs-resolver: true
overrides:
  axios: "^1.18.1"
  "brace-expansion@5": "^5.0.8"
  "@hono/node-server": "^2.0.12"
  # Transitive-only advisories — see .github/workflows/security-auto-remediate.yml.
  # `pnpm audit --fix override` emits one selector per advisory, which produces
  # overlapping ranges (four for hono alone). Collapsed to the broadest selector
  # per major line: each of these subsumes the narrower ones it replaced.
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "fast-uri@>=3.0.0 <3.1.5": "^3.1.5"
  "hono@<4.12.34": "^4.12.34"
  "js-yaml@>=3.0.0 <3.15.1": "^3.15.1"
  axios@>=1.0.0 <1.20.0: ^1.20.0
  axios@>=1.12.0 <1.20.0: ^1.20.0
  axios@>=1.13.0 <1.20.0: ^1.20.0
  axios@>=1.15.0 <1.20.0: ^1.20.0
  axios@>=1.15.1 <1.20.0: ^1.20.0
  axios@>=1.15.2 <1.20.0: ^1.20.0
