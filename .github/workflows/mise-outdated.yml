name: Mise Outdated Check
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Check for outdated mise-managed tools
        id: check
        run: |
          set -euo pipefail
          outdated=$(mise outdated --bump --json | jq --arg path "$(pwd)/mise.toml" 'with_entries(select(.value.source.path == $path))')
          echo "$outdated"
          count=$(echo "$outdated" | jq 'length')
          if [ "$count" -gt 0 ]; then
            body=$(
              {
                echo "\`mise\`-managed tools in \`mise.toml\` have newer versions available. This repo has no Dependabot coverage for mise (there is no mise/asdf ecosystem in Dependabot), so this scheduled check is the only automated signal for these."
                echo
                echo "| Tool | Current | Available |"
                echo "| --- | --- | --- |"
                echo "$outdated" | jq -r 'to_entries[] | "| \(.key) | \(.value.current) | \(.value.bump) |"'
                echo
                echo "Node is deliberately pinned to the 24.x LTS line — a newer major showing here is not automatically staleness; only bump it as a deliberate decision. Everything else is a routine bump. See the \`dep-audit\` skill."
              }
            )
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<MISE_OUTDATED_EOF"
              echo "$body"
              echo "MISE_OUTDATED_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.check.outputs.found }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --search "Outdated mise-managed tools in:title" --state open --json number --jq '.[0].number // empty')
          if [ "$FOUND" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$BODY"
            else
              gh issue create --title "Outdated mise-managed tools" --body "$BODY"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All mise-managed tools are up to date."
          fi
